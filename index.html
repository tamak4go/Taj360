<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Taj Mahal 3D - Khám phá 360°</title>
<meta name="theme-color" content="#6e8fb2">
<meta name="description" content="Mô hình 3D Taj Mahal chân thực với chu kỳ ngày đêm, tương tác góc nhìn 360 độ và tối ưu di động.">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<style>
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #e8d5c8;
  touch-action: none;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
}
#look-zone {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: auto;
  touch-action: none;
}
#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

/* Joystick */
#joy-zone {
  position: absolute;
  left: calc(18px + var(--sal));
  bottom: calc(18px + var(--sab));
  width: 104px;
  height: 104px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(20,24,35,0.32) 100%);
  border: 1.5px solid rgba(255,255,255,0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  pointer-events: auto;
  touch-action: none;
}
#joy-knob {
  position: absolute;
  left: 30px;
  top: 30px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d4e0eb 100%);
  opacity: 0.9;
  box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 2px 2px rgba(255,255,255,0.8);
  pointer-events: none;
  transition: transform 0.03s linear;
}

/* Control buttons */
.btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.22);
  background: rgba(20,24,35,0.48);
  color: rgba(255,255,255,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  touch-action: none;
  padding: 0;
  outline: none;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn:active {
  transform: scale(0.92);
  background: rgba(255,255,255,0.35);
  color: #111;
}
.btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  pointer-events: none;
}

.ctrl-col {
  position: absolute;
  right: calc(16px + var(--sar));
  bottom: calc(18px + var(--sab));
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: auto;
}

#top-right-bar {
  position: absolute;
  right: calc(16px + var(--sar));
  top: calc(14px + var(--sat));
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}

#tbar {
  position: absolute;
  left: calc(16px + var(--sal));
  top: calc(14px + var(--sat));
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(20,24,35,0.48);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 28px;
  padding: 4px 12px 4px 6px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  pointer-events: auto;
}
#tsl {
  width: 110px;
  height: 6px;
  opacity: 0.85;
  accent-color: #f7d8ba;
  cursor: pointer;
}
#time-badge {
  color: #fff;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.3px;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  min-width: 68px;
}

/* Loading Overlay */
#ld {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: radial-gradient(circle at center, #293859 0%, #111827 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  padding: 24px;
}
.ld-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
  max-width: 320px;
  padding: 30px 24px;
  border-radius: 24px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  color: #fff;
}
.ld-spinner {
  width: 44px;
  height: 44px;
  border: 3.5px solid rgba(255,255,255,0.22);
  border-top-color: #ffd8a8;
  border-radius: 50%;
  animation: sp 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
.ld-title {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.4);
}
.ld-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.78);
  line-height: 1.45;
}
.ld-btn {
  margin-top: 6px;
  padding: 10px 22px;
  border-radius: 24px;
  border: none;
  background: #ffd8a8;
  color: #1a233a;
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  transition: transform 0.15s, background 0.15s;
}
.ld-btn:active {
  transform: scale(0.94);
  background: #ffffff;
}

/* Mobile responsive adjustments */
@media (max-width: 600px) {
  #tsl { width: 85px; }
  #tbar { padding: 3px 10px 3px 5px; gap: 7px; }
  #time-badge { font-size: 11px; min-width: 58px; }
  #joy-zone { width: 96px; height: 96px; }
  #joy-knob { width: 40px; height: 40px; left: 28px; top: 28px; }
}
</style>
</head>
<body>

<div id="ld">
  <div class="ld-card">
    <div class="ld-spinner"></div>
    <div class="ld-title">Taj Mahal 3D</div>
    <div id="ld-msg" class="ld-sub">Đang khởi tạo không gian 3D...</div>
    <button id="ld-btn" class="ld-btn" style="display:none">Bắt đầu khám phá</button>
  </div>
</div>

<div id="look-zone"></div>

<div id="ui">
  <div id="joy-zone"><div id="joy-knob"></div></div>
  
  <div id="tbar">
    <button id="btn-auto" class="btn" aria-label="Tự động tua thời gian" title="Tự động tua thời gian">
      <svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="ico-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <input id="tsl" type="range" min="0" max="24" step="0.05" value="16.5" aria-label="Thời gian trong ngày">
    <span id="time-badge">16:30 · Chiều</span>
  </div>

  <div id="top-right-bar">
    <button id="btn-reset" class="btn" aria-label="Đặt lại góc nhìn" title="Đặt lại góc nhìn">
      <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
    </button>
    <button id="btn-door" class="btn" aria-label="Vào lăng mộ" title="Chuyển đổi góc nhìn Nội/Ngoại thất">
      <svg id="ico-enter" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 13l4-4-4-4v3H3v2h8v3z"/></svg>
      <svg id="ico-exit" viewBox="0 0 24 24" style="display:none"><path d="M19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4 13v-3H7v-2h8V8l4 4-4 4z"/></svg>
    </button>
  </div>

  <div class="ctrl-col">
    <button id="btn-up" class="btn" aria-label="Bay lên"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></button>
    <button id="btn-dn" class="btn" aria-label="Hạ xuống"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
  </div>
</div>

<script>
// --- Multi-CDN Resilient Loader with Fallback ---
(function() {
  const cdns = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  let idx = 0;
  function loadNext() {
    if (idx >= cdns.length) {
      const msg = document.getElementById('ld-msg');
      if (msg) msg.innerHTML = '<span style="color:#ff8787">Không thể tải thư viện 3D. Vui lòng kiểm tra kết nối mạng và làm mới trang.</span>';
      return;
    }
    const s = document.createElement('script');
    s.src = cdns[idx++];
    s.crossOrigin = 'anonymous';
    s.onload = () => {
      if (typeof THREE !== 'undefined') {
        startApp();
      } else {
        loadNext();
      }
    };
    s.onerror = loadNext;
    document.head.appendChild(s);
  }
  loadNext();
})();

let hasBooted = false;
function startApp() {
  if (hasBooted || typeof THREE === 'undefined') return;
  hasBooted = true;
  try {
    boot();
  } catch(err) {
    console.error("Boot error:", err);
    const msg = document.getElementById('ld-msg');
    if (msg) msg.innerHTML = '<span style="color:#ff8787">Trình duyệt không hỗ trợ WebGL. Thử mở lại trong Chrome hoặc Safari.</span>';
  }
}

function boot() {
  const isMobile = /Android|iPhone|iPad|iPod|Windows Phone|webOS/i.test(navigator.userAgent) 
    || (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xead7c3, 0.0024);
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.3, 1500);
  
  // Safe WebGLRenderer initialization
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      antialias: !isMobile,
      powerPreference: isMobile ? 'default' : 'high-performance'
    });
  } catch(e) {
    renderer = new THREE.WebGLRenderer({ antialias: false });
  }

  const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.35 : 1.75);
  renderer.setPixelRatio(dpr);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = isMobile ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  document.body.appendChild(renderer.domElement);

  // WebGL context restoration
  renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault();
  }, false);
  renderer.domElement.addEventListener('webglcontextrestored', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.needsUpdate = true;
  }, false);

  const skyGeo = new THREE.SphereGeometry(900, isMobile ? 24 : 32, isMobile ? 18 : 24);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      cTop: { value: new THREE.Color() },
      cMid: { value: new THREE.Color() },
      cBot: { value: new THREE.Color() },
      sunD: { value: new THREE.Vector3(0, 1, 0) },
      st: { value: 0 }
    },
    vertexShader: `
      varying vec3 vD;
      void main(){
        vD = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif
      uniform vec3 cTop, cMid, cBot, sunD;
      uniform float st;
      varying vec3 vD;
      void main(){
        vec3 d = normalize(vD);
        float h = d.y;
        vec3 c = mix(cBot, cMid, smoothstep(-0.05, 0.22, h));
        c = mix(c, cTop, smoothstep(0.22, 0.78, h));
        float s = max(dot(d, sunD), 0.0);
        c += vec3(1.0, 0.8, 0.5) * pow(s, 24.0) * 0.5 + vec3(1.0, 0.95, 0.85) * smoothstep(0.9992, 0.9998, s);
        float m = max(dot(d, -sunD), 0.0);
        c += vec3(0.9, 0.92, 1.0) * smoothstep(0.9994, 0.9997, m) * st;
        vec3 g = floor(mod(d * 220.0, 1000.0));
        float r = fract(sin(dot(g, vec3(12.9898, 78.233, 45.164))) * 43758.5453);
        c += vec3(step(0.9965, r) * st * smoothstep(0.0, 0.25, h));
        gl_FragColor = vec4(c, 1.0);
      }
    `
  });
  const skyDome = new THREE.Mesh(skyGeo, skyMat);
  skyDome.frustumCulled = false;
  skyDome.renderOrder = -1;
  scene.add(skyDome);

  const hemiLight = new THREE.HemisphereLight(0xfff5e8, 0x9e8c7a, 0.68);
  scene.add(hemiLight);

  const sunLight = new THREE.DirectionalLight(0xffe1b8, 1.25);
  sunLight.position.set(85, 95, 70);
  sunLight.castShadow = true;
  const shadowRes = isMobile ? 1024 : 2048;
  sunLight.shadow.mapSize.set(shadowRes, shadowRes);
  sunLight.shadow.camera.near = 10;
  sunLight.shadow.camera.far = 340;
  sunLight.shadow.camera.left = -95;
  sunLight.shadow.camera.right = 95;
  sunLight.shadow.camera.top = 95;
  sunLight.shadow.camera.bottom = -95;
  sunLight.shadow.bias = -0.0006;
  scene.add(sunLight);

  const fillLight = new THREE.DirectionalLight(0x9ec0e6, 0.35);
  fillLight.position.set(-70, 50, -60);
  scene.add(fillLight);

  function makeMarbleTex(bg, vein, detail) {
    const size = isMobile ? 256 : 512;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = vein;
    ctx.lineWidth = isMobile ? 1.0 : 1.4;
    const veinsCount = isMobile ? 25 : 40;
    for (let i = 0; i < veinsCount; i++) {
      ctx.beginPath();
      let x = Math.random() * size, y = Math.random() * size;
      ctx.moveTo(x, y);
      for (let s = 0; s < 5; s++) {
        x += (Math.random() - 0.5) * (size * 0.17);
        y += (Math.random() - 0.5) * (size * 0.17);
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    if (detail) {
      ctx.strokeStyle = 'rgba(170,152,132,0.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(size * 0.02, size * 0.02, size * 0.96, size * 0.96);
      ctx.strokeRect(size * 0.05, size * 0.05, size * 0.9, size * 0.9);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function makeFrameMat(w, h, aw, ah, sy, main) {
    const baseW = isMobile ? 256 : 512;
    const cw = baseW, ch = Math.round(baseW * h / w);
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const x = c.getContext('2d');
    const X = v => (v + w / 2) / w * cw, Y = v => ch - v / h * ch;
    x.fillStyle = '#f3ede2';
    x.fillRect(0, 0, cw, ch);
    const col = ['#b3414a', '#3f7f5a', '#3b5b9a', '#c89a3a'];
    const step = isMobile ? 32 : 24;
    for (let gy = 30; gy < ch - 20; gy += step) {
      for (let gx = 30; gx < cw - 20; gx += step) {
        x.fillStyle = col[((gx + gy) / step | 0) % 4];
        x.beginPath(); x.arc(gx, gy, 3, 0, 6.283); x.fill();
        x.fillStyle = '#d9ccb8';
        x.fillRect(gx + 8, gy - 1, 4, 2);
      }
    }
    const arch = o => {
      x.beginPath();
      x.moveTo(X(-aw / 2 - o), Y(0));
      x.lineTo(X(-aw / 2 - o), Y(sy));
      x.quadraticCurveTo(X(-aw / 2 - o), Y(sy + (ah - sy) * 0.68), X(0), Y(ah + o * 1.3));
      x.quadraticCurveTo(X(aw / 2 + o), Y(sy + (ah - sy) * 0.68), X(aw / 2 + o), Y(sy));
      x.lineTo(X(aw / 2 + o), Y(0));
      x.stroke();
    };
    x.strokeStyle = '#f3ede2'; x.lineWidth = cw * 0.1; arch(w * 0.05);
    x.strokeStyle = '#2a2420'; x.lineWidth = cw * 0.035; x.setLineDash([7, 3]); arch(w * 0.06);
    x.setLineDash([]);
    x.strokeStyle = '#cbbba6'; x.lineWidth = 3; arch(w * 0.035); arch(w * 0.085);
    x.strokeStyle = main ? '#2a2420' : '#8d7a66'; x.lineWidth = 6; x.setLineDash([9, 4]);
    x.strokeRect(14, 14, cw - 28, ch - 28);
    const t = new THREE.CanvasTexture(c);
    if (!isMobile) t.anisotropy = 4;
    return new THREE.MeshStandardMaterial({ map: t, roughness: 0.38, metalness: 0.04 });
  }

  function makeStoneTex(col1, col2) {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = col1;
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = col2;
    ctx.lineWidth = 2;
    for (let y = 0; y < 256; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      const off = (y / 32) % 2 === 0 ? 0 : 32;
      for (let x = off; x < 256; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 32); ctx.stroke();
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function makeJaliTex() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#d6c6b2';
    ctx.fillRect(0, 0, 256, 256);
    ctx.fillStyle = '#3a2e25';
    for (let y = 16; y < 240; y += 32) {
      for (let x = 16; x < 240; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, y - 10);
        ctx.lineTo(x + 10, y);
        ctx.lineTo(x, y + 10);
        ctx.lineTo(x - 10, y);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.strokeStyle = '#b59f84';
    ctx.lineWidth = 8;
    ctx.strokeRect(4, 4, 248, 248);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  const texMarble = makeMarbleTex('#f6f1e7', 'rgba(205,190,172,0.38)', true);
  const texDome = makeMarbleTex('#fbf6ed', 'rgba(212,196,175,0.32)', false);
  texDome.repeat.set(4, 3);
  const texRedStone = makeStoneTex('#9e4f42', '#7d392e');
  texRedStone.repeat.set(14, 14);
  const texWalkStone = makeStoneTex('#d8c7b6', '#b59f8b');
  texWalkStone.repeat.set(4, 36);
  const texJali = makeJaliTex();

  const matMarble = new THREE.MeshStandardMaterial({ map: texMarble, roughness: 0.34, metalness: 0.04 });
  const matMarblePlain = new THREE.MeshStandardMaterial({ color: 0xf4eee3, roughness: 0.36, metalness: 0.04 });
  const matMarbleDark = new THREE.MeshStandardMaterial({ color: 0xc2b39f, roughness: 0.48, metalness: 0.05 });
  const matRecess = new THREE.MeshStandardMaterial({ color: 0xb8a793, roughness: 0.62, metalness: 0.04 });
  const matWindow = new THREE.MeshStandardMaterial({ color: 0x3b322b, roughness: 0.7, metalness: 0.1 });
  const matDome = new THREE.MeshStandardMaterial({ map: texDome, roughness: 0.28, metalness: 0.06 });
  const matGold = new THREE.MeshStandardMaterial({ color: 0xd9a84e, roughness: 0.22, metalness: 0.85 });
  const matRedStone = new THREE.MeshStandardMaterial({ map: texRedStone, roughness: 0.72, metalness: 0.02 });
  const matWalkway = new THREE.MeshStandardMaterial({ map: texWalkStone, roughness: 0.55, metalness: 0.04 });

  function addBox(parent, w, h, d, mat, x, y, z, ry = 0, cast = true, recv = true) {

  function makeArchOpeningShape(fw, fh, aw, ah, springY) {
    const s = new THREE.Shape();
    s.moveTo(-fw / 2, 0);
    s.lineTo(fw / 2, 0);
    s.lineTo(fw / 2, fh);
    s.lineTo(-fw / 2, fh);
    s.closePath();
    const h = new THREE.Path();
    h.moveTo(-aw / 2, 0);
    h.lineTo(-aw / 2, springY);
    h.quadraticCurveTo(-aw / 2, springY + (ah - springY) * 0.68, 0, ah);
    h.quadraticCurveTo(aw / 2, springY + (ah - springY) * 0.68, aw / 2, springY);
    h.lineTo(aw / 2, 0);
    h.closePath();
    s.holes.push(h);
    return s;
  }

  function buildRecessedArch(w, h, depth, archW, archH, springY, frameMat, hasInnerWin) {

    const pa = extGeo.attributes.position, ua = extGeo.attributes.uv;
    for (let i = 0; i < pa.count; i++) ua.setXY(i, pa.getX(i) / w + 0.5, pa.getY(i) / h);
    const frontMesh = new THREE.Mesh(extGeo, [frameMat, matMarblePlain]);
    frontMesh.castShadow = true;
    frontMesh.receiveShadow = true;
    g.add(frontMesh);
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.5), matRecess);
    backWall.position.set(0, h / 2, -depth - 0.25);
    backWall.castShadow = true;
    backWall.receiveShadow = true;
    g.add(backWall);
    const topCap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.25, 0.38, depth + 0.5), matMarblePlain);
    topCap.position.set(0, h - 0.19, -depth / 2);
    topCap.castShadow = true;

  const waterMat = new THREE.ShaderMaterial({
    uniforms: {
      t: { value: 0 },
      mt: { value: mirrorRT.texture },
      sd: { value: new THREE.Vector3(0, 1, 0) },
      z0: { value: POOL_Z_START + 5 },
      dk: { value: 1 },
      fc: { value: new THREE.Color() },
      fdn: { value: 0.0024 }
    },
    vertexShader: `
      varying vec3 w;
      varying vec4 s;
      void main(){
        vec4 p = modelMatrix * vec4(position, 1.0);
        w = p.xyz;
        gl_Position = projectionMatrix * viewMatrix * p;
        s = gl_Position;

    `,
    fragmentShader: `
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif
      uniform float t, z0, dk, fdn;
      uniform vec3 fc;
      uniform sampler2D mt;
      uniform vec3 sd;
      varying vec3 w;
      varying vec4 s;
      float f(vec2 p){
        return sin(p.x * 2.3 + p.y * 0.9 - t * 1.6) * 0.5 + sin(p.x * 3.7 - p.y * 1.7 + t * 2.1) * 0.3 + sin(p.y * 0.55 - t * 1.1 + p.x) * 0.4;
      }
      void main(){
        vec2 p = w.xz;
        float dz = mod(p.y - z0 + 3.25, 6.5) - 3.25;
        float r = length(vec2(p.x, dz));
        float h = f(p) * 0.03 + sin(r * 6.0 - t * 4.0) * exp(-r * 0.5) * 0.05;
        float sw = max(s.w, 0.0001);
        vec2 n = (s.xy / sw) * 0.5 + 0.5;
        vec3 vd = normalize(cameraPosition - w);
        vec3 nn = normalize(vec3(h * 14.0, 1.0, h * 14.0));
        float dist = length(cameraPosition - w);
        vec2 uv = clamp(n + nn.xz * 0.9 / (8.0 + dist * 0.25), 0.002, 0.998);

      return;

    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { lookZone.setPointerCapture(e.pointerId); } catch(err) {}

    if (activePointers.size === 1) {

      lastLY = e.clientY;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    clk += dt;

    waterMat.uniforms.t.value = clk;
    updFountain(clk);
    if (auto) {
      hour = (hour + dt * 0.4) % 24;
      tsl.value = hour;
      applyTime(hour);
    }

    let moveF = -joyVec.y;
    let moveR = joyVec.x;
    let moveU = btnVert;
    if (keys['KeyW'] || keys['ArrowUp']) moveF += 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveF -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveR += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveR -= 1;
    if (keys['KeyE'] || keys['Space']) moveU += 1;
    if (keys['KeyQ'] || keys['ShiftLeft']) moveU -= 1;

    const speed = isInside ? 7.5 : 22.0;
    fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
    right.set(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();
    camera.position.addScaledVector(fwd, moveF * speed * dt);
    camera.position.addScaledVector(right, moveR * speed * dt);
    camera.position.y += moveU * (isInside ? 5.5 : 15.0) * dt;

    if (isInside) {
      const r = Math.hypot(camera.position.x, camera.position.z);
      if (r > 10.6) {
        camera.position.x = (camera.position.x / r) * 10.6;
        camera.position.z = (camera.position.z / r) * 10.6;
      }
      camera.position.y = Math.max(PLINTH_Y + 1.4, Math.min(PLINTH_Y + 13.5, camera.position.y));
    } else {
      camera.position.y = Math.max(1.2, Math.min(130, camera.position.y));
      camera.position.x = Math.max(-180, Math.min(180, camera.position.x));
      camera.position.z = Math.max(-140, Math.min(220, camera.position.z));
      if (camera.position.y < PLINTH_Y + 23 && Math.abs(camera.position.x) < 19.8 && Math.abs(camera.position.z) < 19.8) {
        const dx = 19.8 - Math.abs(camera.position.x);
        const dz = 19.8 - Math.abs(camera.position.z);
        if (dx < dz) camera.position.x = Math.sign(camera.position.x || 1) * 19.8;
        else camera.position.z = Math.sign(camera.position.z || 1) * 19.8;
      }
    }

    euler.set(pitch, yaw, 0, 'YXZ');
    camera.quaternion.setFromEuler(euler);
    skyDome.position.copy(camera.position);

    // Dynamic mirror reflection update (adaptive interval for mobile 60fps)
    const mirrorInterval = isMobile ? 3 : 2;
    if (!isInside && (fr++ % mirrorInterval === 0)) {
      renderMirror();
    }

    skyDome.position.copy(camera.position);
    renderer.render(scene, camera);
  }

  // Pre-compilation and graceful loader fadeout
  try {
    renderer.compile(scene, camera);
  } catch(e) {
    console.warn("Shader compile warning:", e);
  }

  function hideLoader() {
    const ld = document.getElementById('ld');
    if (ld && ld.parentNode) {
      ld.style.opacity = '0';
      setTimeout(() => {
        if (ld.parentNode) ld.parentNode.removeChild(ld);
      }, 600);
    }
  }

  const ldBtn = document.getElementById('ld-btn');
  if (ldBtn) ldBtn.addEventListener('click', hideLoader);

  // Safety fallback: ensure loading screen NEVER stays stuck forever
  setTimeout(() => {
    if (ldBtn) ldBtn.style.display = 'inline-block';
  }, 2500);

  let warmFrames = 0;
  const t0 = performance.now();
  (function warm() {
    try {
      renderMirror();
      renderer.render(scene, camera);
    } catch(err) {
      console.warn("Warm frame render note:", err);
    }
    if (++warmFrames < (isMobile ? 3 : 5) && performance.now() - t0 < 600) {
      requestAnimationFrame(warm);
      return;
    }
    clock.getDelta();
    hideLoader();
    animate();
  })();
}
</script>
